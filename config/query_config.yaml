# Step 5 query-engine configuration — see Doc/step-5-requirements.md for the full spec.

working_dir: ~/work/hybrid_rag
manifest_db: manifest.db     # relative to working_dir; FTS5 lives here (Step 4)
logs_dir: logs                # relative to working_dir

# --- Indexes to query (Step 4 output) ---
lancedb_dir: lancedb
lancedb_table: chunks
fts5_table: chunks_fts

# --- Embedding (must match Step 4's indexing model) ---
ollama_url: http://localhost:11434   # NOT :8080 (Open WebUI)
embedding_model: nomic-embed-text
embed_timeout_seconds: 60

# --- Generation (§2 step 5, Open Question #1 — confirmed) ---
generation_model: qwen3:8b
num_ctx: 8192          # explicit override — Ollama defaults to 4K under 24GiB VRAM
think: false            # faithfulness to retrieved context > chain-of-thought for RAG
generation_timeout_seconds: 120

# --- Retrieval + fusion (§2 steps 1-3) ---
top_n_dense: 20
top_n_sparse: 20
rrf_k: 60               # standard RRF constant
top_k_fused: 8          # chunks sent to the LLM after fusion

# --- Opt-in general-knowledge fallback (query/relevance.py) ---
# Off by default: strict document-grounding is the point of this project (see
# Doc/step-5-requirements.md's design note). When on, a query the knowledge base has
# nothing relevant for gets answered from the model's own general knowledge instead,
# always visibly prefixed "General knowledge (not from your documents):" so a
# document-grounded answer can never be confused with one that wasn't.
allow_general_knowledge_fallback: false
relevance_distance_threshold: 0.7   # calibrated empirically — see query/relevance.py
relevance_min_hits: 2                # >=N of the top dense results must clear the threshold

# --- HTTP server for Open WebUI (§4) — local only, Open WebUI runs on this machine ---
http_host: 127.0.0.1
http_port: 8100         # NOT :8080 (Open WebUI) or :11434 (Ollama)

# --- MCP server for OpenClaw (§5) — bound to the LAN, not 127.0.0.1, since OpenClaw
# runs on npabot-u24 and needs to reach this over the network (confirmed: npabot-u24
# can already reach this desktop directly, no tunnel needed in this direction). ---
mcp_host: 0.0.0.0
mcp_port: 8200
